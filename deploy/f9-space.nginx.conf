server {
    listen 80 default_server;
    server_name 43.160.215.184 _;

    root /var/www/f9-space;
    index index.html;

    location /api/github-trending {
        proxy_pass https://api.github.com/search/repositories;
        proxy_ssl_server_name on;
        proxy_set_header Host api.github.com;
        proxy_set_header User-Agent "F9-Space";
        proxy_set_header Accept "application/vnd.github+json";
    }

    location /api/ai-news {
        proxy_pass https://aihot.virxact.com/api/public/items;
        proxy_ssl_server_name on;
        proxy_set_header Host aihot.virxact.com;
        proxy_set_header User-Agent "Mozilla/5.0";
        proxy_set_header Accept "application/json";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}

server {
    server_name f9aigc.icu www.f9aigc.icu;

    root /var/www/f9-space;
    index index.html;

    location /api/github-trending {
        proxy_pass https://api.github.com/search/repositories;
        proxy_ssl_server_name on;
        proxy_set_header Host api.github.com;
        proxy_set_header User-Agent "F9-Space";
        proxy_set_header Accept "application/vnd.github+json";
    }

    location /api/ai-news {
        proxy_pass https://aihot.virxact.com/api/public/items;
        proxy_ssl_server_name on;
        proxy_set_header Host aihot.virxact.com;
        proxy_set_header User-Agent "Mozilla/5.0";
        proxy_set_header Accept "application/json";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/f9aigc.icu/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/f9aigc.icu/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.f9aigc.icu) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = f9aigc.icu) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name f9aigc.icu www.f9aigc.icu;
    return 404; # managed by Certbot
}
